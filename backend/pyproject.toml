[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvs-backend"
version = "0.1.0"
description = "HVS-3B Search Studio backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic>=2,<3",
    "numpy",
    "opencv-python-headless",
    "pillow",
    "sse-starlette",
    "pytest>=8",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hvs_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
